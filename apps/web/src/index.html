<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>team-up</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f6f5e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#6fbfa6" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- Loading screen. Its colors never change, so the theme is not visible until it is applied. -->
    <style>
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2f6f5e;
      }
      .loading-screen img {
        width: 6rem;
        height: 6rem;
      }
    </style>
  </head>
  <body>
    <!-- Angular replaces this content once the theme is applied. -->
    <app-root>
      <div class="loading-screen">
        <img src="/icons/apple-touch-icon-180.png" alt="" />
      </div>
    </app-root>
  </body>
</html>
